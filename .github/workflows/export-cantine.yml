name: Export CSV Cantine

on:
  # ── Déclenchement automatique : chaque lundi à 7h00 (heure Paris) ──────────
  # UTC+1 en hiver → 06:00 UTC  |  UTC+2 en été → 05:00 UTC
  # On choisit 06:00 UTC, ce qui couvre l'heure d'hiver ; en été l'e-mail
  # arrivera à 08:00 — ajustez si besoin.
  schedule:
    - cron: '0 6 * * 1'

  # ── Déclenchement manuel depuis l'onglet Actions de GitHub ─────────────────
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pas de dépendance npm : le script utilise uniquement fetch (natif Node 18+)
      - name: Générer le CSV et envoyer l'e-mail
        env:
          FIREBASE_URL:    ${{ secrets.FIREBASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM:       ${{ secrets.MAIL_FROM }}
          MAIL_TO:         ${{ secrets.MAIL_TO }}
        run: node export-csv.js
