name: Export CSV Cantine

on:
  # ── Déclenchement automatique : chaque lundi à 7h00 (heure Paris) ──────────
  # UTC+1 en hiver → 13:30 UTC  |  UTC+2 en été → 14:30 UTC
  # On choisit 13:30 UTC, ce qui couvre l'heure d'hiver ; en été l'e-mail
  # arrivera à 14:30 — ajustez si besoin.
  schedule:
    - cron: '30 13 * * *'

  # ── Déclenchement manuel depuis l'onglet Actions de GitHub ─────────────────
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Vérifie si aujourd'hui est le dernier jour du mois (heure Paris)
      - name: Vérifier dernier jour du mois
        id: check
        run: |
          TODAY=$(TZ=Europe/Paris date +%d)
          LAST=$(TZ=Europe/Paris date -d "$(TZ=Europe/Paris date +%Y-%m-01) +1 month -1 day" +%d)
          if [ "$TODAY" = "$LAST" ]; then
            echo "is_last_day=true" >> $GITHUB_OUTPUT
          else
            echo "is_last_day=false" >> $GITHUB_OUTPUT
          fi

      # Pas de dépendance npm : le script utilise uniquement fetch (natif Node 18+)
      - name: Générer le CSV et envoyer l'e-mail
        if: steps.check.outputs.is_last_day == 'true' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_URL:    ${{ secrets.FIREBASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM:       ${{ secrets.MAIL_FROM }}
          MAIL_TO:         ${{ secrets.MAIL_TO }}
        run: node export-csv.js
