<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cantine — Planning du mois</title>
  <link rel="stylesheet" href="style.css?v=17" />
</head>
<body>

  <!-- ══════════════════════════════════════════════
       HEADER
  ══════════════════════════════════════════════ -->

  <header class="app-header">
    <div class="header-left">
      <div class="app-icon">🍽️</div>
      <div>
        <h1 class="app-title">Cantine</h1>
        <p class="app-subtitle" id="monthLabel">Chargement…</p>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-nav" id="prevMonthBtn" title="Mois précédent">‹</button>
      <button class="btn-nav" id="nextMonthBtn" title="Mois suivant">›</button>
      <button class="btn-add" id="addPersonBtn">+ Ajouter</button>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════
       TABLEAU PRINCIPAL
  ══════════════════════════════════════════════ -->
  <div class="table-header-fixed" id="tableHeaderFixed">
    <table><thead id="tableHead"></thead></table>
  </div>
  <main class="table-wrapper">
    <div class="table-scroll-container" id="tableContainer">
      <table class="survey-table" id="surveyTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
    <div class="mask-under-table"></div>
  </main>

  <!-- ══════════════════════════════════════════════
       POP-UP VOTE
  ══════════════════════════════════════════════ -->
<div class="modal-overlay" id="voteModal">
    <div class="modal-card">
        <div class="modal-header">
            <div id="nameStar" class="modal-header-name">
              <div>
                <p class="modal-label">Vote de</p>
                <h2 class="modal-person" id="modalPersonName">—</h2>
              </div>
            </div>
            <button class="modal-close" id="closeModal">✕</button>
        </div>
        <div class="modal-month-label" id="modalMonthLabel"></div>
        <div class="modal-grid-wrapper">
            <div class="modal-grid" id="modalGrid"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-validate" id="validateVoteBtn">✓ Enregistrer mon planning</button>
        </div>
    </div>
</div>

  <!-- ══════════════════════════════════════════════
       POP-UP AJOUTER PERSONNE
  ══════════════════════════════════════════════ -->
<div class="modal-overlay" id="addModal">
<div id="addModal" class="modal-card modal-card--small">
  <div class="modal-header">
    <h2 class="modal-person">Nouveau participant</h2>
    <button class="modal-close" id="closeAddModal">✕</button>
  </div>
  <div style="padding: 24px;">
    <label class="field-label">Prénom Nom</label>
    <input type="text" class="field-input" id="newPersonInput" placeholder="ex. Marie Dupont" autocomplete="off" />
    <p class="field-hint">La personne apparaîtra dans la liste de tous les mois.</p>
    <button class="btn-validate" id="confirmAddPerson" style="margin-top:16px">Ajouter</button>
  </div>
</div>

  </div>

  <!-- ══════════════════════════════════════════════
       POP-UP IMPRESSION
  ══════════════════════════════════════════════ -->
  <div class="modal-overlay" id="printModal">
    <div class="modal-card modal-card--print">
      <div class="modal-header">
        <div>
          <p class="modal-label">Liste du repas</p>
          <h2 class="modal-person" id="printDayTitle">—</h2>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn-print-action" id="printBtn" title="Imprimer">🖨️ Imprimer</button>
          <button class="modal-close" id="closePrintModal">✕</button>
        </div>
      </div>

      <!-- Zone imprimée -->
      <div class="print-body" id="printBody">
        <div class="print-page-header">
          <span class="print-page-icon">🍽️</span>
          <div>
            <div class="print-page-title">Cantine</div>
            <div class="print-page-date" id="printDayTitlePage">—</div>
          </div>
        </div>

        <div class="print-sections">
          <!-- 11h45 -->
          <div class="print-section print-section--1145">
            <div class="print-section-header">
              <span class="print-section-icon">🕚</span>
              <span class="print-section-title">11h45</span>
              <span class="print-badge print-count">0</span>
              <span class="print-badge-label">inscrits</span>
            </div>
            <ol class="print-list" id="printList1145"></ol>
          </div>

          <!-- 12h30 -->
          <div class="print-section print-section--1230">
            <div class="print-section-header">
              <span class="print-section-icon">🕧</span>
              <span class="print-section-title">12h30</span>
              <span class="print-badge print-count">0</span>
              <span class="print-badge-label">inscrits</span>
            </div>
            <ol class="print-list" id="printList1230"></ol>
          </div>

          <!-- Végétarien -->
          <div class="print-section print-section--veg">
            <div class="print-section-header">
              <span class="print-section-icon">🌱</span>
              <span class="print-section-title">Végétarien</span>
              <span class="print-badge print-count">0</span>
              <span class="print-badge-label">inscrits</span>
            </div>
            <ol class="print-list" id="printListVeg"></ol>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════
       TOAST
  ══════════════════════════════════════════════ -->

  <div class="toast" id="toast"></div>

  <!-- Versions 11 du script data.js et 24 de app.js -->
  <script src="data.js?v=11"></script>
  <script src="app.js?v=24"></script>

</body>
</html>
